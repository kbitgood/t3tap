[package]
name = "t3tap"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Stream a T3 Code thread as it happens."
repository = "https://github.com/kbitgood/t3tap"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
regex = "1"
rquickjs = "0.14"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.4"

[profile.release]
strip = true
lto = true
